# WireGuard Master Node Configuration (/etc/wireguard/wg0.conf)
# Encrypts ZeroMQ (ports 5557/5558) and Control Plane communication between master and remote workers

[Interface]
Address = 10.10.100.1/24
ListenPort = 51820
PrivateKey = MASTER_PRIVATE_KEY_REPLACE_ME
SaveConfig = false

# Allow IP forwarding and NAT for worker subnet
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Worker Node 1
[Peer]
PublicKey = WORKER1_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.10.100.11/32

# Worker Node 2
[Peer]
PublicKey = WORKER2_PUBLIC_KEY_REPLACE_ME
AllowedIPs = 10.10.100.12/32
