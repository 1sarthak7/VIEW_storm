version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: viewstorm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viewstorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewstorm_password}
      POSTGRES_DB: ${POSTGRES_DB:-viewstorm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viewstorm} -d ${POSTGRES_DB:-viewstorm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viewstorm_network

  redis:
    image: redis:7-alpine
    container_name: viewstorm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - viewstorm_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  viewstorm_network:
    driver: bridge
