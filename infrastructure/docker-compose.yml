version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: viewstorm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viewstorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewstorm_password}
      POSTGRES_DB: ${POSTGRES_DB:-viewstorm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viewstorm} -d ${POSTGRES_DB:-viewstorm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - viewstorm_network

  redis:
    image: redis:7-alpine
    container_name: viewstorm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - viewstorm_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: viewstorm-backend
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://viewstorm:viewstorm_password@postgres:5432/viewstorm
      - VIEWSTORM_TARGET_LOCAL_URL=http://backend:8000
      - VIEWSTORM_MASTER_BIND_HOST=0.0.0.0
      - VIEWSTORM_MASTER_BIND_PORT=5557
      - VIEWSTORM_MASTER_ADVERTISE_HOST=backend
    ports:
      - "8000:8000"
      - "5557:5557"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - viewstorm_network

  worker-agent-1:
    build:
      context: ..
      dockerfile: worker-agent/Dockerfile
    container_name: viewstorm-worker-1
    restart: unless-stopped
    command: ["--server-url", "http://backend:8000", "--name", "docker-worker-01", "--capacity", "250", "--locustfile", "simulator/locustfile.py"]
    depends_on:
      - backend
    networks:
      - viewstorm_network

  worker-agent-2:
    build:
      context: ..
      dockerfile: worker-agent/Dockerfile
    container_name: viewstorm-worker-2
    restart: unless-stopped
    command: ["--server-url", "http://backend:8000", "--name", "docker-worker-02", "--capacity", "250", "--locustfile", "simulator/locustfile.py"]
    depends_on:
      - backend
    networks:
      - viewstorm_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  viewstorm_network:
    driver: bridge
