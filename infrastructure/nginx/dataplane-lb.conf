upstream dataplane_backend {
    least_conn;
    server dataplane-1:8001 max_fails=3 fail_timeout=10s;
    server dataplane-2:8001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8001 backlog=4096;
    server_name _;

    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Performance buffers
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://dataplane_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location /health {
        proxy_pass http://dataplane_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
