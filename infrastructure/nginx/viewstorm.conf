# ViewStorm Production Reverse Proxy Configuration

upstream controlplane_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream frontend_backend {
    server 127.0.0.1:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name viewstorm.internal;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name viewstorm.internal;

    # TLS Certificates (self-signed / internal CA / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/viewstorm.crt;
    ssl_certificate_key /etc/ssl/private/viewstorm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Frontend Dashboard
    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Control Plane API & WebSocket endpoints
    location /api/ {
        proxy_pass http://controlplane_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Health Check (unauthenticated internal ping)
    location /health {
        proxy_pass http://controlplane_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Prometheus Metrics (restrict to monitoring CIDR)
    location /metrics {
        allow 10.10.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://controlplane_backend/metrics;
    }
}
