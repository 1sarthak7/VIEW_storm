global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "viewstorm-controlplane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["control-plane:8000"]

  - job_name: "viewstorm-dataplane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["dataplane-1:8001", "dataplane-2:8001"]
