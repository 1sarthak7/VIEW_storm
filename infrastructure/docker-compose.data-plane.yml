version: "3.8"

services:
  dataplane-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: viewstorm-dataplane-1
    restart: unless-stopped
    command: ["uvicorn", "app.dataplane_main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    environment:
      - APP_ENV=production
      - VIEWSTORM_SERVICE_MODE=data_plane
      - REDIS_URL=redis://10.10.2.1:6379/0
      - DATABASE_URL=postgresql+asyncpg://viewstorm:viewstorm_password@10.10.2.1:5432/viewstorm
      - VIEWSTORM_TARGET_LOCAL_URL=http://dataplane-lb:8001
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    networks:
      - data_plane_net

  dataplane-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: viewstorm-dataplane-2
    restart: unless-stopped
    command: ["uvicorn", "app.dataplane_main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    environment:
      - APP_ENV=production
      - VIEWSTORM_SERVICE_MODE=data_plane
      - REDIS_URL=redis://10.10.2.1:6379/0
      - DATABASE_URL=postgresql+asyncpg://viewstorm:viewstorm_password@10.10.2.1:5432/viewstorm
      - VIEWSTORM_TARGET_LOCAL_URL=http://dataplane-lb:8001
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    networks:
      - data_plane_net

  dataplane-lb:
    image: nginx:1.25-alpine
    container_name: viewstorm-dataplane-lb
    restart: unless-stopped
    volumes:
      - ./nginx/dataplane-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:8001"
    depends_on:
      - dataplane-1
      - dataplane-2
    networks:
      - data_plane_net
      - worker_net

networks:
  data_plane_net:
    external: true
  worker_net:
    external: true
